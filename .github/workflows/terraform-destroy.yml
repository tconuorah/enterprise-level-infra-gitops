name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev | staging | prod)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      stack:
        description: "Stack to destroy"
        required: true
        type: choice
        options:
          - networking
          - platform

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

     # ✅ REQUIRED so vars.* from GitHub Environments load correctly
    environment: ${{ github.event_name == 'pull_request'
      && (github.base_ref == 'main' && 'prod' || github.base_ref)
      || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

    # ✅ define once, reuse everywhere
    env:
      ENV_NAME: ${{ github.event_name == 'pull_request'
        && (github.base_ref == 'main' && 'prod' || github.base_ref)
        || (github.ref_name == 'main' && 'prod' || github.ref_name) }}

      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VERSION: ${{ vars.TF_VERSION }}
      
    strategy:
      fail-fast: false
      matrix:
        stack: [networking, platform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/environments/${{ github.ref_name == 'main' && 'prod' || github.ref_name }}/${{ vars.AWS_REGION }}/${{ matrix.stack }}
        run: terraform init -input=false

      - name: Terraform destroy
        working-directory: infra/environments/${{ github.ref_name == 'main' && 'prod' || github.ref_name }}/${{ vars.AWS_REGION }}/${{ matrix.stack }}
        env:
          TF_VAR_project: terraform_gitops
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
        run: terraform destroy -input=false -auto-approve
